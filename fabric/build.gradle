plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'me.modmuss50.mod-publish-plugin' version "${mod_publish_plugin_version}"
}

base {
	archivesName = project.archives_base_name
}

repositories {
	exclusiveContent {
		forRepository {
			maven { url = 'https://maven.azureaaron.net/releases' }
		}
		filter {
			includeGroup 'net.azureaaron'
		}
	}
}

sourceSets {
	main {
		java {
			srcDir "src/compat/${project.compat_dir}/java"
		}
		resources {
			srcDir "src/compat/${project.compat_dir}/resources"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Converts Hypixel's 1.8 item NBT into modern ItemStacks (Apache-2.0, by AzureAaron).
	// Not transitive: its newer DataFixerUpper would replace Minecraft's own in dev runs (26.1.2's
	// NbtOps doesn't implement the newer DFU methods). The released jar only bundles this jar anyway.
	include implementation("net.azureaaron:legacy-item-dfu:${project.legacy_item_dfu_version}") { transitive = false }

	// The Minecraft-free data layer, bundled into the mod jar.
	include implementation(project(':core'))
}

processResources {
	inputs.property 'version', project.version
	inputs.property 'minecraft_range', project.minecraft_range
	filesMatching('fabric.mod.json') {
		expand 'version': project.version, 'minecraft_range': project.minecraft_range
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release = 25
}

java {
	withSourcesJar()
}

jar {
	from(rootProject.file('LICENSE')) {
		rename { "${it}_${project.archives_base_name}" }
	}
}

publishMods {
	file = jar.archiveFile
	changelog = providers.environmentVariable('CHANGELOG').orElse('See GitHub releases.')
	displayName = "${project.mod_version} for Minecraft ${project.minecraft_version}"
	type = STABLE
	modLoaders.add('fabric')
	dryRun = providers.environmentVariable('MODRINTH_TOKEN').getOrNull() == null

	modrinth {
		accessToken = providers.environmentVariable('MODRINTH_TOKEN')
		projectId = project.modrinth_id
		minecraftVersions.add(project.minecraft_version)
		requires 'fabric-api'
	}
}
