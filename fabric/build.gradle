plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'me.modmuss50.mod-publish-plugin' version "${mod_publish_plugin_version}"
}

base {
	archivesName = project.archives_base_name
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// The Minecraft-free data layer, bundled into the mod jar.
	include implementation(project(':core'))
}

processResources {
	inputs.property 'version', project.version
	filesMatching('fabric.mod.json') {
		expand 'version': project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release = 25
}

java {
	withSourcesJar()
}

jar {
	from(rootProject.file('LICENSE')) {
		rename { "${it}_${project.archives_base_name}" }
	}
}

publishMods {
	file = jar.archiveFile
	changelog = providers.environmentVariable('CHANGELOG').orElse('See GitHub releases.')
	type = STABLE
	modLoaders.add('fabric')
	dryRun = providers.environmentVariable('MODRINTH_TOKEN').getOrNull() == null

	modrinth {
		accessToken = providers.environmentVariable('MODRINTH_TOKEN')
		projectId = project.modrinth_id
		minecraftVersions.add(project.minecraft_version)
		requires 'fabric-api'
	}
}
