name: Release

# Push a tag like v0.2.0 to build a jar for every supported Minecraft version, attach them all to
# one GitHub release, and upload each to Modrinth (only if the MODRINTH_TOKEN secret is set).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mc: ['26.1.2', '26.2', '26.3']
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build -Pmc=${{ matrix.mc }}
      - uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.mc }}
          path: fabric/build/libs/skyblock-pv-*[0-9].jar
      - name: Publish to Modrinth
        if: ${{ env.MODRINTH_TOKEN != '' }}
        run: ./gradlew :fabric:publishMods -Pmc=${{ matrix.mc }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: jar-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: '*.jar'
          generate_release_notes: true
