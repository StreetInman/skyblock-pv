name: Release

# Push a tag like v0.1.0 to build the jar, attach it to a GitHub release, and upload it to Modrinth.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build
      - uses: softprops/action-gh-release@v2
        with:
          files: fabric/build/libs/skyblock-pv-*[0-9].jar
          generate_release_notes: true
      - name: Publish to Modrinth
        if: ${{ env.MODRINTH_TOKEN != '' }}
        run: ./gradlew :fabric:publishMods
