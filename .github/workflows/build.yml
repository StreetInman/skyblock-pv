name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ['26.1.2', '26.2', '26.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build -Pmc=${{ matrix.mc }} --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: skyblock-pv-mc${{ matrix.mc }}
          path: fabric/build/libs/skyblock-pv-*[0-9].jar
