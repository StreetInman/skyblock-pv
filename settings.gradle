pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = 'skyblock-pv'

include 'core'
// `-PcoreOnly` builds and tests the data layer without Minecraft (handy offline or in restricted networks).
if (!providers.gradleProperty('coreOnly').isPresent()) {
	include 'fabric'
}
